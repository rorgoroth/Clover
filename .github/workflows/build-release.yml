name: Build

# - Pull requests: build only (APKs are attached to the run as an artifact).
# - Pushes to main / manual runs: build, then replace the rolling "latest"
#   pre-release with freshly built APKs.
#
# Docs-only and markdown-only pushes are skipped so editing docs/update_api.json
# (which deploys GitHub Pages) doesn't trigger a rebuild.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".github/workflows/static.yml"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Name of the rolling tag/release that always holds the newest build.
  LATEST_TAG: latest

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      signing: ${{ steps.signing.outputs.kind }}
    defaults:
      run:
        working-directory: Clover
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5
        with:
          validate-wrappers: true

      - name: Read version from app/build.gradle
        id: version
        run: |
          VERSION=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"(v[0-9]+\.[0-9]+\.[0-9]+)".*/\1/p' app/build.gradle | head -n1)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not find versionName in Clover/app/build.gradle"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # app/build.gradle only signs the release build when app/keys.properties exists.
      # Without it the release APKs are unsigned and cannot be installed, so:
      #   - with the ANDROID_* secrets set  -> sign with your real key
      #   - without them (e.g. fork PRs)    -> sign with a throwaway key so the APK still installs
      #     (a throwaway key is different every run, so such APKs can't be updated in place)
      - name: Configure release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks
            STORE_PASS="$KEYSTORE_PASSWORD"
            ALIAS="$KEY_ALIAS"
            KEY_PASS="$KEY_PASSWORD"
            echo "kind=release" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set - signing with a throwaway key."
            STORE_PASS=$(openssl rand -hex 16)
            ALIAS=ci
            KEY_PASS="$STORE_PASS"
            keytool -genkeypair -keystore app/release.jks -storetype PKCS12 \
              -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PASS" -keypass "$KEY_PASS" -dname "CN=Clover CI"
            echo "kind=throwaway" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "keystoreFile=release.jks"
            echo "keystorePass=$STORE_PASS"
            echo "keyAlias=$ALIAS"
            echo "keyPass=$KEY_PASS"
          } > app/keys.properties

      - name: Build stable + dev release APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleStableRelease assembleDevRelease

      - name: Collect and verify APKs
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p ../dist
          cp "app/build/outputs/apk/stable/release/Clover-${VERSION}.apk"     ../dist/Clover-stable.apk
          cp "app/build/outputs/apk/dev/release/Clover-${VERSION}-dev.apk"    ../dist/Clover-dev.apk

          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n1)apksigner
          for apk in ../dist/*.apk; do
            "$APKSIGNER" verify --print-certs "$apk" | head -n3
          done
          ls -lh ../dist

      - uses: actions/upload-artifact@v7
        with:
          name: apks
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

  release:
    # Not for pull requests: only builds from main (or a manual run) replace "latest".
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-latest
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: apks
          path: dist

      - name: Replace the rolling "latest" release
        env:
          VERSION: ${{ needs.build.outputs.version }}
          SIGNING: ${{ needs.build.outputs.signing }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          {
            echo "Automated build of \`${VERSION}\` from commit [\`${SHORT_SHA}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})."
            echo
            echo "- \`Clover-stable.apk\` - stable flavor"
            echo "- \`Clover-dev.apk\` - dev flavor (same package name as stable, so install one or the other)"
            echo
            echo "This release is rebuilt on every push to \`main\`. For versioned releases see the [releases page](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases)."
            echo "Build log: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            if [ "$SIGNING" != "release" ]; then
              echo
              echo "> [!WARNING]"
              echo "> Signed with a throwaway CI key, not the project's release key. It will not update over a differently signed install."
            fi
          } > notes.md

          # Delete and recreate so the tag moves to this commit and stale assets disappear.
          gh release delete "$LATEST_TAG" --cleanup-tag --yes || true
          gh release create "$LATEST_TAG" dist/*.apk \
            --target "$GITHUB_SHA" \
            --title "Latest build (${VERSION}, ${SHORT_SHA})" \
            --notes-file notes.md \
            --latest=true